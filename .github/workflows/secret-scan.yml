name: Secret leak guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan tracked files for high-risk secret patterns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'supabase secret key': re.compile(r'\bsb_secret_[A-Za-z0-9._-]+'),
              'supabase service role': re.compile(r'\bservice_role\b\s*[:=]\s*["\'][^"\']{16,}["\']', re.I),
              'google oauth secret': re.compile(r'\bGOCSPX-[A-Za-z0-9_-]{16,}'),
              'github token': re.compile(r'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}'),
              'github fine-grained token': re.compile(r'\bgithub_pat_[A-Za-z0-9_]{20,}'),
              'generic client secret assignment': re.compile(r'\bclient[_-]?secret\b\s*[:=]\s*["\'][^"\']{12,}["\']', re.I),
          }

          skip_dirs={'.git','node_modules','.wrangler'}
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for label,rx in patterns.items():
                  if rx.search(text):
                      hits.append((str(p),label))

          if hits:
              print('Potential secret material detected. Values are intentionally not printed.')
              for path,label in hits:
                  print(f'- {path}: {label}')
              sys.exit(1)
          print('No high-risk secret patterns detected.')
          PY
