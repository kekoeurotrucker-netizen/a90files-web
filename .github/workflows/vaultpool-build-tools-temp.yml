name: VaultPool temporary PowerShell
on:
  push:
    branches:
      - vaultpool-build-tools-temp-20260921

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pack runner PowerShell
        shell: bash
        run: |
          set -euo pipefail
          PWSH="$(command -v pwsh)"
          REAL="$(readlink -f "$PWSH")"
          ROOT="$(dirname "$REAL")"
          mkdir -p /tmp/vppwsh
          tar -C "$ROOT" -czf /tmp/vppwsh/pwsh-linux-x64.tar.gz .
          sha256sum /tmp/vppwsh/pwsh-linux-x64.tar.gz > /tmp/vppwsh/SHA256SUMS.txt
          "$PWSH" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' > /tmp/vppwsh/PWSH_VERSION.txt
      - name: Upload PowerShell
        uses: actions/upload-artifact@v4
        with:
          name: vaultpool-pwsh
          path: /tmp/vppwsh/*
          compression-level: 0
          retention-days: 1
