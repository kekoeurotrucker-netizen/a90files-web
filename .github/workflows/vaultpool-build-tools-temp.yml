name: VaultPool temporary Go toolchain
on:
  push:
    branches:
      - vaultpool-build-tools-temp-20260921

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Go 1.27.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Pack Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vptools
          tar -C "$(go env GOROOT)" -czf /tmp/vptools/go1.27.0-linux-amd64.tar.gz .
          sha256sum /tmp/vptools/go1.27.0-linux-amd64.tar.gz > /tmp/vptools/SHA256SUMS.txt
          go version > /tmp/vptools/GO_VERSION.txt
      - name: Upload Go toolchain
        uses: actions/upload-artifact@v4
        with:
          name: vaultpool-go127-only
          path: /tmp/vptools/*
          compression-level: 0
          retention-days: 1
